name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Detect project root & install dependencies
        run: |
          if [ -f "nexaflow/package.json" ]; then
            echo "Project root detected at nexaflow/"
            cd nexaflow && (npm ci || npm install)
          elif [ -f "package.json" ]; then
            echo "Project root detected at repository root."
            npm ci || npm install
          elif [ -f "app/package.json" ]; then
            echo "Project root detected at app/"
            cd app && (npm ci || npm install)
          else
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              echo "Project root detected at $SUBDIR"
              cd "$SUBDIR" && (npm ci || npm install)
            fi
          fi

      - name: Build production bundle
        run: |
          if [ -f "nexaflow/package.json" ]; then
            cd nexaflow && npm run build
          elif [ -f "package.json" ]; then
            npm run build
          elif [ -f "app/package.json" ]; then
            cd app && npm run build
          else
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR" && npm run build
            fi
          fi

      - name: Locate build artifacts
        id: locate-dist
        run: |
          if [ -d "nexaflow/dist" ]; then
            echo "dist_path=nexaflow/dist" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "dist_path=dist" >> $GITHUB_OUTPUT
          elif [ -d "app/dist" ]; then
            echo "dist_path=app/dist" >> $GITHUB_OUTPUT
          else
            DIST_FOUND=$(find . -maxdepth 3 -type d -name "dist" -not -path "*/node_modules/*" | head -n 1)
            echo "dist_path=${DIST_FOUND:-dist}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-dist.outputs.dist_path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
